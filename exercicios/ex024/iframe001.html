<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o Uso de um iframe</h1>
    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px" width="500px" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em video</a>
        </iframe>
        para aprender a programar
    </p>
    <p>
        O repositorio do guanabara
        <iframe src="https://gustavoguanabara.github.io/html-css" frameborder="0" height="500px" width="500px">
            no <a href="https://gustavoguanabara.github.io/html-css" target="_blank">github</a>
        </iframe>
        também é legal
    </p>
</body>
</html>
